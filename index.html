
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Defaults for the homepage. scripts/prerender.mjs rewrites title, description,
      canonical and the og:*/twitter:* tags per route at build time, and RouteMeta.tsx
      keeps them in sync during client-side navigation.
    -->
    <title>Stratos Market — Local Shop in Anaxos, Lesvos</title>
    <meta name="description" content="A family-run shop in Anaxos, Lesvos, fifty metres from the beach. Lesvos olive oil, honey, PDO Ladotyri, sheep's-milk yoghurt, wine and ouzo. Open every day.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.stratosmarket.com/">

    <meta property="og:type" content="business.business">
    <meta property="og:site_name" content="Stratos Market">
    <meta property="og:locale" content="en_GB">
    <meta property="og:title" content="Stratos Market — Local Shop in Anaxos, Lesvos">
    <meta property="og:description" content="A family-run shop in Anaxos, Lesvos, fifty metres from the beach. Lesvos olive oil, honey, PDO Ladotyri, sheep's-milk yoghurt, wine and ouzo. Open every day.">
    <meta property="og:url" content="https://www.stratosmarket.com/">
    <meta property="og:image" content="https://www.stratosmarket.com/images/og-shop.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The shopfront of Stratos Market in Anaxos, Lesvos">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Stratos Market — Local Shop in Anaxos, Lesvos">
    <meta name="twitter:description" content="A family-run shop in Anaxos, Lesvos, fifty metres from the beach. Lesvos olive oil, honey, PDO Ladotyri, sheep's-milk yoghurt, wine and ouzo. Open every day.">
    <meta name="twitter:image" content="https://www.stratosmarket.com/images/og-shop.jpg">

    <link rel="icon" type="image/svg+xml" href="/lesvos-logo-optionb.svg">

</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
